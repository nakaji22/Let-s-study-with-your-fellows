<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>生徒アカウント登録</title>
</head>
<body>

    <h1>生徒アカウント登録</h1>

    <!-- 1. どこへ送信するか
    2. どのJavaオブジェクトと結び付けるか
    3. どのHTTPメソッドで送信するか -->
    <form th:action="@{/signup/student}" 
          th:object="${studentSignupForm}" 
          method="post"> 

        <div>
            <label for="loginId">ログインID</label> <!-- 入力欄とラベルを結びつける -->
            <input type="text"
                   id="loginId"
                   th:field="*{loginId}"> <!-- studentSignupForm.loginIdを意味する(th:object="${studentSignupForm}" を指定しているため) -->
            <!-- loginIdにエラーがあった場合だけ、<p>タグ内のメッセージを表示する -->
            <p th:if="${#fields.hasErrors('loginId')}"
               th:errors="*{loginId}">
                ログインIDのエラーメッセージ
            </p>
        </div>

        <div>
            <label for="displayName">表示名</label>
            <input type="text"
                   id="displayName"
                   th:field="*{displayName}">

            <p th:if="${#fields.hasErrors('displayName')}"
               th:errors="*{displayName}">
                表示名のエラーメッセージ
            </p>
        </div>

        <div>
            <label for="grade">学年</label>
            <select id="grade"
                    th:field="*{grade}">

                <option value="">選択してください</option>
                <!-- Grade.java に定義されているすべてのenum値を順番に取り出す処理 -->
                <!-- ${T~は、JavaクラスをThymeleafから参照する記法 -->
                <option th:each="grade : ${T(com.example.tkg_studysupport.entity.Grade).values()}" 
                        th:value="${grade}"
                        th:text="${grade}">
                </option>
            </select>

            <p th:if="${#fields.hasErrors('grade')}"
               th:errors="*{grade}">
                学年のエラーメッセージ
            </p>
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password"
                   id="password"
                   th:field="*{password}">

            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
                パスワードのエラーメッセージ
            </p>
        </div>

        <div>
            <label for="passwordConfirmation">確認用パスワード</label>
            <input type="password"
                   id="passwordConfirmation"
                   th:field="*{passwordConfirmation}">

            <p th:if="${#fields.hasErrors('passwordConfirmation')}"
               th:errors="*{passwordConfirmation}">
                確認用パスワードのエラーメッセージ
            </p>
        </div>

        <div>
            <button type="submit">登録する</button>
        </div>

    </form>

    <hr>

    <p>
        <a th:href="@{/signup/owner}">講師として登録する</a>
    </p>

    <p>
        <a th:href="@{/login}">ログイン画面へ戻る</a>
    </p>

</body>
</html>

<!-- 
${...}⇒Modelや現在の変数から値を取り出します。
*{...}⇒th:object で指定したオブジェクトのフィールドを参照します。
@{...}⇒URLを表します。 
-->

<!-- 
ブラウザで /signup/student を開く
        ↓
SignupController の GETメソッドが呼ばれる
        ↓
空の StudentSignupForm を Model に入れる
        ↓
student-signup.html を表示する
        ↓
利用者が入力して「登録する」を押す
        ↓
POST /signup/student
        ↓
SignupController の POSTメソッドが呼ばれる
        ↓
入力値が StudentSignupForm に格納される
        ↓
@Valid で入力チェック
        ↓
問題なければ AccountService.registerStudent() を呼ぶ
        ↓
Account と StudentProfile をDBへ保存する -->
