<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>講師アカウント登録</title>
</head>
<body>

    <h1>講師アカウント登録</h1>

    <form th:action="@{/signup/owner}"
          th:object="${ownerSignupForm}"
          method="post">

        <div>
            <label for="loginId">ログインID</label>
            <input type="text"
                   id="loginId"
                   th:field="*{loginId}">

            <p th:if="${#fields.hasErrors('loginId')}"
               th:errors="*{loginId}">
                ログインIDのエラーメッセージ
            </p>
        </div>

        <div>
            <label for="displayName">表示名</label>
            <input type="text"
                   id="displayName"
                   th:field="*{displayName}">

            <p th:if="${#fields.hasErrors('displayName')}"
               th:errors="*{displayName}">
                表示名のエラーメッセージ
            </p>
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password"
                   id="password"
                   th:field="*{password}">

            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
                パスワードのエラーメッセージ
            </p>
        </div>

        <div>
            <label for="passwordConfirmation">確認用パスワード</label>
            <input type="password"
                   id="passwordConfirmation"
                   th:field="*{passwordConfirmation}">

            <p th:if="${#fields.hasErrors('passwordConfirmation')}"
               th:errors="*{passwordConfirmation}">
                確認用パスワードのエラーメッセージ
            </p>
        </div>

        <div>
            <label for="ownerRegistrationCode">講師コード</label>
            <input type="password"
                   id="ownerRegistrationCode"
                   th:field="*{ownerRegistrationCode}">

            <p th:if="${#fields.hasErrors('ownerRegistrationCode')}"
               th:errors="*{ownerRegistrationCode}">
                講師コードのエラーメッセージ
            </p>
        </div>

        <div>
            <button type="submit">登録する</button>
        </div>

    </form>

    <hr>

    <p>
        <a th:href="@{/signup/student}">生徒として登録する</a>
    </p>

    <p>
        <a th:href="@{/login}">ログイン画面へ戻る</a>
    </p>

</body>
</html>
