<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>コミュニティ掲示板</title>

    <!-- cssの読み込み -->
    <link rel="stylesheet"
          th:href="@{/css/board.css}">
</head>

<!--
外部JSファイル board.js では Thymeleaf の /*[[${openStudyLogModal}]]*/ が使いにくいため、
代わりにHTML側に data-* 属性として値を埋め込み、JS側で読み取る。

Controllerの
model.addAttribute("openStudyLogModal", true);
と、
JSファイルの
document.body.dataset.openStudyLogModal === "true"
がつながっている。

エラーがなければ false、エラーがあれば true になる。
-->
<body th:data-open-study-log-modal="${openStudyLogModal != null and openStudyLogModal}">

    <!-- Controllerの model.addAttribute("community", community); とつながっている。 -->
    <h1 th:text="${community.communityName}">
        コミュニティ名
    </h1>

    <p>
        <a th:href="@{/home}">
            ホームへ戻る
        </a>
    </p>

    <!-- redirectAttributes.addFlashAttribute("successMessage", "勉強時間を登録しました。"); とつながる。 -->
    <p th:if="${successMessage}"
       th:text="${successMessage}">
    </p>

    <section>
        <h2>勉強記録一覧</h2>

        <!-- STUDENTのときだけ表示 -->
        <button id="openStudyLogDialog"
                type="button"
                th:if="${role != null and role.name() == 'STUDENT'}">
            勉強時間を登録する
        </button>

        <!-- STUDENTのときだけdialog自体も表示 -->
        <dialog id="studyLogDialog"
                th:if="${role != null and role.name() == 'STUDENT'}">

            <!-- ボタンが押されたら指定URLに studyLogRegisterForm のObjectとともにPOST通信を送る。 -->
            <form th:action="@{/communities/{communityId}/board(communityId=${community.communityId})}"
                  th:object="${studyLogRegisterForm}"
                  method="post">

                <h2>勉強時間を登録する</h2>

                <!-- フォーム全体のエラー検知 -->
                <div th:if="${#fields.hasGlobalErrors()}">
                    <p class="error-message"
                       th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                    </p>
                </div>

                <div>
                    <label for="studiedOn">
                        勉強した日
                    </label>

                    <input id="studiedOn"
                           type="date"
                           th:field="*{studiedOn}">

                    <p class="error-message"
                       th:if="${#fields.hasErrors('studiedOn')}"
                       th:errors="*{studiedOn}">
                    </p>
                </div>

                <div>
                    <label for="studyMinutes">
                        勉強時間
                    </label>

                    <select id="studyMinutes"
                            th:field="*{studyMinutes}">

                        <option value="">
                            選択してください
                        </option>

                        <!-- 5分刻みの選択肢を自動生成 -->
                        <option th:each="minutes : ${#numbers.sequence(5, 1440, 5)}"
                                th:value="${minutes}"
                                th:text="${minutes + '分'}">
                        </option>
                    </select>

                    <p class="error-message"
                       th:if="${#fields.hasErrors('studyMinutes')}"
                       th:errors="*{studyMinutes}">
                    </p>
                </div>

                <div>
                    <button type="submit">
                        記録する
                    </button>

                    <button id="closeStudyLogDialog"
                            type="button">
                        キャンセル
                    </button>
                </div>
            </form>
        </dialog>

        <!-- model.addAttribute("studyLogs", studyLogService.findStudyLogsByCommunity(communityId)); とつながっている。 -->
        <p th:if="${#lists.isEmpty(studyLogs)}">
            まだ勉強記録はありません。
        </p>

        <table th:unless="${#lists.isEmpty(studyLogs)}"
               border="1">
            <thead>
                <tr>
                    <th>勉強日</th>
                    <th>生徒名</th>
                    <th>勉強時間</th>
                    <th>登録日時</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="studyLog : ${studyLogs}"
                    class="clickable-row"
                    th:data-href="@{/communities/{communityId}/board/studylog/{studyLogId}(
                        communityId=${community.communityId},
                        studyLogId=${studyLog.studyLogId}
                    )}">

                    <td th:text="${studyLog.studiedOn}">
                        2026-06-12
                    </td>

                    <td th:text="${studyLog.loggedBy.account.displayName}">
                        生徒名
                    </td>

                    <td th:text="${studyLog.studyMinutes + '分'}">
                        60分
                    </td>

                    <td th:text="${studyLog.createdAt}">
                        2026-06-12T18:00
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- 外部jsファイルの読み込み -->
    <script th:src="@{/js/board.js}"></script>

</body>
</html>
